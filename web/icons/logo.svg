<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- شعار «حجز الكتب»: كتاب مفتوح ذهبي تخرج منه شرارة معرفة، فوقه شارة خصم %، على خلفية بنفسجية متدرجة -->
  <defs>
    <radialGradient id="bg" cx="0.72" cy="0.18" r="1.05">
      <stop offset="0" stop-color="#8b55cc"/><stop offset="0.45" stop-color="#5a2d94"/><stop offset="1" stop-color="#22103d"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe7a1"/><stop offset="0.55" stop-color="#fbc94d"/><stop offset="1" stop-color="#f0930b"/></linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#efe6fb"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#12051f" flood-opacity=".45"/></filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <!-- لمعة خفيفة -->
  <path d="M0 116 Q0 0 116 0 H396 Q470 0 500 60 Q330 30 180 140 Q80 210 0 300 Z" fill="#fff" opacity=".07"/>
  <!-- هالة المعرفة -->
  <circle cx="256" cy="214" r="78" fill="#fbc94d" opacity=".35" filter="url(#glow)"/>
  <!-- شرارة/نجمة المعرفة -->
  <path d="M256 118 L268 178 L322 196 L268 214 L256 274 L244 214 L190 196 L244 178 Z" fill="url(#gold)"/>
  <circle cx="318" cy="132" r="9" fill="#ffe7a1"/><circle cx="192" cy="140" r="6" fill="#ffe7a1" opacity=".85"/>
  <!-- الكتاب المفتوح -->
  <g filter="url(#sh)">
    <path d="M96 268 Q176 236 252 272 V412 Q176 378 96 404 Z" fill="url(#page)"/>
    <path d="M416 268 Q336 236 260 272 V412 Q336 378 416 404 Z" fill="url(#page)"/>
    <path d="M84 280 V418 Q170 388 256 428 Q342 388 428 418 V280" fill="none" stroke="url(#gold)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M256 274 V426" stroke="#e4d5f5" stroke-width="6" stroke-linecap="round"/>
    <g stroke="#c9b1ea" stroke-width="9" stroke-linecap="round">
      <path d="M126 300 Q170 288 222 306"/><path d="M126 334 Q170 322 222 340"/><path d="M126 368 Q170 356 206 370"/>
      <path d="M386 300 Q342 288 290 306"/><path d="M386 334 Q342 322 290 340"/><path d="M386 368 Q342 356 306 370"/>
    </g>
  </g>
  <!-- شارة الخصم -->
  <g transform="translate(392 112)">
    <circle r="54" fill="url(#gold)" stroke="#2a1347" stroke-width="8"/>
    <text x="0" y="20" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="58" fill="#2a1347">%</text>
  </g>
</svg>
