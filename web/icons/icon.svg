      <path d="M0 -26v-4"/><path d="M-13 -22.5l-2 -3.5"/><path d="M13 -22.5l2 -3.5"/><path d="M-22.5 -13l-3.5 -2"/><path d="M22.5 -13l3.5 -2"/>
