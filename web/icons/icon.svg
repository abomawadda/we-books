    <!-- الكتاب المفتوح -->
    <path d="M0 2C-8 -3 -19 -4 -27 -1V21C-19 18 -8 19 0 24Z" fill="#552c83"/>
    <path d="M0 2C8 -3 19 -4 27 -1V21C19 18 8 19 0 24Z" fill="#7c4bb6"/>
    <path d="M-27 21C-19 18 -8 19 0 24C8 19 19 18 27 21" stroke="#f9b224" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    <path d="M-20 6l13 2M-20 12l13 2M7 8l13 -2M7 14l13 -2" stroke="#fff" stroke-opacity=".55" stroke-width="1.8" stroke-linecap="round"/>
