    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fde08a"/><stop offset="1" stop-color="#f9b224"/></linearGradient>
  </defs>
  <rect width="120" height="120" rx="28" fill="url(#bg)"/>
  <g transform="translate(60 60)">
    <!-- ترس: 12 سناً -->
    <g fill="#f9b224">
      <rect x="-5" y="-47" width="10" height="11" rx="2"/><rect x="-5" y="-47" width="10" height="11" rx="2" transform="rotate(30)"/>
      <rect x="-5" y="-47" width="10" height="11" rx="2" transform="rotate(60)"/><rect x="-5" y="-47" width="10" height="11" rx="2" transform="rotate(90)"/>
      <rect x="-5" y="-47" width="10" height="11" rx="2" transform="rotate(120)"/><rect x="-5" y="-47" width="10" height="11" rx="2" transform="rotate(150)"/>
      <rect x="-5" y="-47" width="10" height="11" rx="2" transform="rotate(180)"/><rect x="-5" y="-47" width="10" height="11" rx="2" transform="rotate(210)"/>
      <rect x="-5" y="-47" width="10" height="11" rx="2" transform="rotate(240)"/><rect x="-5" y="-47" width="10" height="11" rx="2" transform="rotate(270)"/>
      <rect x="-5" y="-47" width="10" height="11" rx="2" transform="rotate(300)"/><rect x="-5" y="-47" width="10" height="11" rx="2" transform="rotate(330)"/>
