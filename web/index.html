<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>منصة حجز الكتب المخفضة · النقابة العامة بالدقهلية</title>
  <meta name="description" content="منظومة مبادرة الكتب الخارجية المدرسية للعاملين: الحجز، التوزيع بالأسبقية، التسليم، التحصيل بالتقسيط.">
  <meta name="theme-color" content="#2a1347">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="حجز الكتب">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/logo.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/app-apple-180.png">
  <link rel="preload" href="fonts/ibm-plex-sans-arabic-arabic-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/ibm-plex-sans-arabic-arabic-700-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="app.css?v=3.42.1">
</head>
<body>
  <!-- شاشة الافتتاح: مرة في كل جلسة حتى يضغط «يلا نبدأ»، وفيها عداد الحملة -->
  <style>
    #splash{position:fixed;inset:0;z-index:95;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:24px 18px calc(24px + env(safe-area-inset-bottom));color:#fff;text-align:center;font-family:Cairo,system-ui,sans-serif;overflow-y:auto;
      background:radial-gradient(120% 80% at 50% 30%,#7a45b8 0%,#462375 45%,#230f3d 100%);transition:opacity .35s ease,visibility .35s}
    #splash.out{opacity:0;visibility:hidden}
    #splash .lg{width:104px;height:104px;border-radius:26px;box-shadow:0 14px 40px rgba(249,178,36,.25)}
    #splash .nm{font-size:25px;font-weight:800;margin-top:6px}
    #splash .sl{font-size:17px;font-weight:800;color:#fde08a}
    #splash .sl2{font-size:13px;font-weight:600;color:#e9ddf8;opacity:.85}
    #splash.quick .cd,#splash.quick .go,#splash.quick .cr{display:none}
    #splash .lg{animation:lgIn .7s cubic-bezier(.2,.9,.3,1.3) both}@keyframes lgIn{from{transform:scale(.6) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}
    #splash .cd{margin-top:14px;width:100%;max-width:340px;border-radius:20px;background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);padding:12px}
    #splash .cd .lb{font-size:13px;font-weight:700;color:#e9ddf8}
    #splash .cd .bx{display:flex;gap:8px;margin-top:8px}
    #splash .cd .bx div{flex:1;border-radius:14px;background:rgba(255,255,255,.1);padding:8px 0}
    #splash .cd b{display:block;font-size:24px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
    #splash .cd span{font-size:11px;color:#cbb8e6}
    #splash .go{margin-top:18px;border:0;cursor:pointer;font:800 17px Cairo,system-ui,sans-serif;color:#2e1650;padding:15px 30px;border-radius:999px;
      background:linear-gradient(135deg,#fde08a,#f9b224);box-shadow:0 10px 30px rgba(249,178,36,.4),inset 0 -3px 0 rgba(0,0,0,.12)}
    #splash .go:active{transform:scale(.97)}
    #splash .cr{margin-top:22px;font-size:12px;line-height:1.7;color:#cbb8e6}
    #splash .cr b{color:#fff;font-weight:700}
    #splash .og{margin-top:6px;font-size:13px;font-weight:700;color:#fde08a}
  </style>
  <div id="splash" aria-label="مرحباً">
    <img class="lg" src="icons/logo.svg" alt="شعار حجز الكتب">
    <div class="nm">حجز الكتب المخفضة</div>
    <div class="sl">كتب ولادك أقرب… وقسطها أخف</div>
    <div class="sl2">نقابتك معاك… من أول كتاب</div>
    <div class="cd" id="spCd" hidden><div class="lb" id="spCdL"></div><div class="bx" dir="ltr"><div><b data-k="d">--</b><span>يوم</span></div><div><b data-k="h">--</b><span>ساعة</span></div><div><b data-k="m">--</b><span>دقيقة</span></div><div><b data-k="s">--</b><span>ثانية</span></div></div></div>
    <button class="go" id="spGo" type="button">يلا نبدأ نسجّل ونحجز</button>
    <div class="cr">التنفيذ والتصميم وجميع الحقوق محفوظة<br>للأستاذ <b>محمود العراقي</b> — أمين صندوق النقابة العامة بالدقهلية</div>
    <div class="og">النقابة العامة بالدقهلية</div>
  </div>
  <script>
    (function () {
      var sp = document.getElementById("splash"), seen = false;
      try { seen = localStorage.getItem("wb_splash") || sessionStorage.getItem("wb_splash"); } catch (e) {}
      // التطبيق المثبّت: لمحة سريعة بالشعار والسلوجان في كل فتح (ثانية ونص) بعد شاشة النظام
      var app = (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true;
      if (seen && app) { sp.classList.add("quick"); setTimeout(function () { sp.classList.add("out"); setTimeout(function () { sp.remove(); }, 450); }, 1500); return; }
      if (seen) { sp.remove(); return; }
      document.getElementById("spGo").addEventListener("click", function () {
        try { localStorage.setItem("wb_splash", "1"); sessionStorage.setItem("wb_splash", "1"); } catch (e) {}
        sp.classList.add("out"); setTimeout(function () { sp.remove(); }, 400);
      });
      /** عداد الحملة: يُستدعى من app.js بعد قراءة مواعيد المرحلة العامة */
      window.splashCountdown = function (ph) {
        var box = document.getElementById("spCd"); if (!box || !ph) return;
        var d = function (v) { if (!v) return null; var x = new Date(String(v).replace(" ", "T")); return isNaN(x) ? null : x; };
        var now = new Date(), st = d(ph.start), en = d(ph.end), dl = d(ph.delivery), at = null, lb = "", nm = ph.name ? ph.name + " — " : "";
        if (st && st > now) { at = st; lb = "🗓️ " + nm + "يبدأ الحجز بعد"; } else if (ph.open && en && en > now) { at = en; lb = "⏳ " + (ph.name ? "الحجز مفتوح - " + ph.name : "الحجز مفتوح") + " · ينتهي الحجز في"; } else if (dl && dl > now) { at = dl; lb = "📦 " + nm + "يبدأ التسليم بعد"; }
        if (!at) return;
        document.getElementById("spCdL").textContent = lb; box.hidden = false;
        var tick = function () { if (!document.getElementById("spCd")) return clearInterval(t); var ms = Math.max(0, at - Date.now()), v = { d: Math.floor(ms / 864e5), h: Math.floor(ms / 36e5) % 24, m: Math.floor(ms / 6e4) % 60, s: Math.floor(ms / 1e3) % 60 };
          Object.keys(v).forEach(function (k) { var e = box.querySelector('[data-k="' + k + '"]'); if (e) e.textContent = String(v[k]).padStart(2, "0"); }); };
        tick(); var t = setInterval(tick, 1000);
      };
    })();
  </script>
  <div id="topProgress" class="hidden fixed top-0 inset-x-0 z-[70] h-[3px] overflow-hidden bg-brand-100"><div class="h-full w-1/2 bg-gradient-to-l from-gold-400 via-brand-500 to-brand-700 animate-progress"></div></div>
  <div id="blocker" class="hidden fixed inset-0 z-[65] bg-white/40 backdrop-blur-[1px] flex items-center justify-center">
    <div class="w-14 h-14 rounded-2xl bg-white shadow-lift flex items-center justify-center"><div class="w-7 h-7 rounded-full border-[3px] border-brand-200 border-t-brand-700 animate-spin"></div></div>
  </div>
  <div id="toasts" class="pointer-events-none fixed z-[80] inset-x-3 top-3 sm:top-auto sm:bottom-6 sm:left-6 sm:right-auto sm:w-[380px] flex flex-col gap-2" aria-live="polite"></div>
  <div id="app"></div>

  <noscript><div style="padding:40px;text-align:center;font-family:sans-serif">يتطلب هذا التطبيق تفعيل JavaScript.</div></noscript>

  <script src="js/pickup.js?v=3.42.1"></script>
  <script src="js/help.js?v=3.42.1"></script>

  <script src="js/emp-extra.js?v=3.42.1"></script>
</body>
</html>
