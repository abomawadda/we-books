<body>
  <!-- شاشة الافتتاح: تظهر مرة في كل جلسة حتى يضغط «يلا نبدأ» -->
  <style>
    #splash{position:fixed;inset:0;z-index:95;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#fff;text-align:center;font-family:Cairo,system-ui,sans-serif;overflow:hidden;
      background:radial-gradient(120% 80% at 50% 35%,#6a3aa0 0%,#3b1d63 45%,#1a0b2e 100%);transition:opacity .55s ease,visibility .55s,transform .55s}
    #splash.out{opacity:0;visibility:hidden;transform:scale(1.06)}
    #splash .halo{position:relative;width:150px;height:150px;display:flex;align-items:center;justify-content:center}
    #splash .halo::before,#splash .halo::after{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,rgba(249,178,36,.45),rgba(249,178,36,0) 65%);animation:spGlow 2.6s ease-in-out infinite}
    #splash .halo::after{animation-delay:1.3s}
    #splash .lg{position:relative;width:118px;height:118px;border-radius:30px;box-shadow:0 18px 50px rgba(249,178,36,.3);animation:spPop .9s cubic-bezier(.2,1.4,.4,1) both,spFloat 4s 1s ease-in-out infinite}
    #splash .nm{font-size:27px;font-weight:800;letter-spacing:-.3px;margin-top:4px;animation:spUp .6s .3s both}
    #splash .sl{font-size:17px;font-weight:700;color:#fde08a;animation:spUp .6s .55s both}
    #splash .sl span{display:inline-block;opacity:0;animation:spWord .5s both}
    #splash .go{margin-top:26px;border:0;cursor:pointer;font:800 17px Cairo,system-ui,sans-serif;color:#2e1650;padding:15px 30px;border-radius:999px;
      background:linear-gradient(135deg,#fde08a,#f9b224);box-shadow:0 10px 30px rgba(249,178,36,.45),inset 0 -3px 0 rgba(0,0,0,.12);animation:spUp .6s 1.4s both,spBeat 2s 2.2s ease-in-out infinite}
    #splash .go:active{transform:scale(.96)}
    #splash .snd{margin-top:10px;font-size:12px;color:#cbb8e6;opacity:.85;animation:spUp .6s 1.6s both}
    #splash .og{position:absolute;bottom:calc(26px + env(safe-area-inset-bottom));font-size:12.5px;color:#cbb8e6;animation:spUp .6s .8s both}
    #splash .pt{position:absolute;bottom:-40px;font-size:22px;opacity:0;animation:spRise linear infinite;pointer-events:none}
    @keyframes spPop{from{transform:scale(.5) rotate(-15deg);opacity:0}to{transform:none;opacity:1}}
    @keyframes spFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
    @keyframes spGlow{0%{transform:scale(.7);opacity:.9}100%{transform:scale(1.6);opacity:0}}
    @keyframes spUp{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
    @keyframes spWord{from{transform:translateY(8px) scale(.9);opacity:0}to{transform:none;opacity:1}}
    @keyframes spBeat{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
    @keyframes spRise{0%{transform:translateY(0) rotate(0);opacity:0}10%{opacity:.85}90%{opacity:.6}100%{transform:translateY(-110vh) rotate(25deg);opacity:0}}
    @media (prefers-reduced-motion:reduce){#splash *,#splash *::before,#splash *::after{animation-duration:.01s!important;animation-iteration-count:1!important}}
  </style>
  <div id="splash" aria-label="مرحباً">
    <div class="halo"><svg class="lg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120"> <defs> <linearGradient id="spbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6a3aa0"/><stop offset="1" stop-color="#2e1650"/></linearGradient> <linearGradient id="spsun" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fde08a"/><stop offset="1" stop-color="#f9b224"/></linearGradient> </defs> <rect width="120" height="120" rx="28" fill="url(#spbg)"/> <g transform="translate(60 60)"> <g fill="#f9b224"> <rect x="-5" y="-47" width="10" height="11" rx="2"/><rect x="-5" y="-47" width="10" height="11" rx="2" transform="rotate(30)"/> <rect x="-5" y="-47" width="10" height="11" rx="2" transform="rotate(60)"/><rect x="-5" y="-47" width="10" height="11" rx="2" transform="rotate(90)"/> <rect x="-5" y="-47" width="10" height="11" rx="2" transform="rotate(120)"/><rect x="-5" y="-47" width="10" height="11" rx="2" transform="rotate(150)"/> <rect x="-5" y="-47" width="10" height="11" rx="2" transform="rotate(180)"/><rect x="-5" y="-47" width="10" height="11" rx="2" transform="rotate(210)"/> <rect x="-5" y="-47" width="10" height="11" rx="2" transform="rotate(240)"/><rect x="-5" y="-47" width="10" height="11" rx="2" transform="rotate(270)"/> <rect x="-5" y="-47" width="10" height="11" rx="2" transform="rotate(300)"/><rect x="-5" y="-47" width="10" height="11" rx="2" transform="rotate(330)"/> </g> <circle r="38" fill="#f9b224"/> <circle r="33" fill="#fff"/> <g stroke="#f9b224" stroke-width="3" stroke-linecap="round"> <path d="M0 -26v-4"/><path d="M-13 -22.5l-2 -3.5"/><path d="M13 -22.5l2 -3.5"/><path d="M-22.5 -13l-3.5 -2"/><path d="M22.5 -13l3.5 -2"/> </g> <circle cy="-6" r="12" fill="url(#spsun)"/> <path d="M0 2C-8 -3 -19 -4 -27 -1V21C-19 18 -8 19 0 24Z" fill="#552c83"/> <path d="M0 2C8 -3 19 -4 27 -1V21C19 18 8 19 0 24Z" fill="#7c4bb6"/> <path d="M-27 21C-19 18 -8 19 0 24C8 19 19 18 27 21" stroke="#f9b224" stroke-width="2.4" fill="none" stroke-linecap="round"/> <path d="M-20 6l13 2M-20 12l13 2M7 8l13 -2M7 14l13 -2" stroke="#fff" stroke-opacity=".55" stroke-width="1.8" stroke-linecap="round"/> </g> </svg></div>
    <div class="nm">حجز الكتب المخفضة</div>
    <div class="sl"><span style="animation-delay:.7s">نقابتك</span> <span style="animation-delay:.85s">معاك…</span> <span style="animation-delay:1s">من</span> <span style="animation-delay:1.1s">أول</span> <span style="animation-delay:1.2s">كتاب</span></div>
    <button class="go" id="spGo" type="button">يلا نبدأ نسجّل ونحجز 🚀</button>
    <div class="snd">🔊 شغّل الصوت لتجربة أجمل</div>
    <div class="og">النقابة العامة بالدقهلية</div>
  </div>
  <script>
    (function () {
      var sp = document.getElementById("splash"), seen = false;
      try { seen = sessionStorage.getItem("wb_splash"); } catch (e) {}
      if (seen) { sp.remove(); return; }
      // جزيئات متصاعدة: كتب ونجوم
      var em = ["📚", "✨", "⭐", "📖", "🎒", "✏️"];
      for (var i = 0; i < 14; i++) { var d = document.createElement("span"); d.className = "pt"; d.textContent = em[i % em.length];
        d.style.left = (4 + Math.random() * 92) + "%"; d.style.fontSize = (14 + Math.random() * 16) + "px";
        d.style.animationDuration = (7 + Math.random() * 7) + "s"; d.style.animationDelay = (Math.random() * 6) + "s"; sp.appendChild(d); }
      // نغمة ترحيب قصيرة (Web Audio) — المتصفحات تسمح بالصوت بعد ضغطة المستخدم فقط
      function chime() {
        try { var A = window.AudioContext || window.webkitAudioContext; if (!A) return; var c = new A(), t = c.currentTime;
          [523.25, 659.25, 783.99, 1046.5].forEach(function (f, k) { var o = c.createOscillator(), g = c.createGain(); o.type = "sine"; o.frequency.value = f;
            g.gain.setValueAtTime(0, t + k * .11); g.gain.linearRampToValueAtTime(.18, t + k * .11 + .02); g.gain.exponentialRampToValueAtTime(.001, t + k * .11 + .7);
            o.connect(g); g.connect(c.destination); o.start(t + k * .11); o.stop(t + k * .11 + .75); });
          setTimeout(function () { c.close && c.close(); }, 1600); } catch (e) {}
      }
      document.getElementById("spGo").addEventListener("click", function () {
        chime(); if (navigator.vibrate) navigator.vibrate([12, 40, 12]);
        try { sessionStorage.setItem("wb_splash", "1"); } catch (e) {}
        setTimeout(function () { sp.classList.add("out"); setTimeout(function () { sp.remove(); }, 600); }, 250);
      });
    })();
  </script>
  <div id="topProgress" class="hidden fixed top-0 inset-x-0 z-[70] h-[3px] overflow-hidden bg-brand-100"><div class="h-full w-1/2 bg-gradient-to-l from-gold-400 via-brand-500 to-brand-700 animate-progress"></div></div>
  <div id="blocker" class="hidden fixed inset-0 z-[65] bg-white/40 backdrop-blur-[1px] flex items-center justify-center">
    <div class="w-14 h-14 rounded-2xl bg-white shadow-lift flex items-center justify-center"><div class="w-7 h-7 rounded-full border-[3px] border-brand-200 border-t-brand-700 animate-spin"></div></div>
  </div>
  <div id="toasts" class="pointer-events-none fixed z-[80] inset-x-3 top-3 sm:top-auto sm:bottom-6 sm:left-6 sm:right-auto sm:w-[380px] flex flex-col gap-2" aria-live="polite"></div>
