<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>منصة حجز الكتب المخفضة · النقابة العامة بالدقهلية</title>
  <meta name="description" content="منظومة مبادرة الكتب الخارجية المدرسية للعاملين: الحجز، التوزيع بالأسبقية، التسليم، التحصيل بالتقسيط.">
  <meta name="theme-color" content="#2a1347">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="حجز الكتب">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preload" href="fonts/ibm-plex-sans-arabic-arabic-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/ibm-plex-sans-arabic-arabic-700-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="app.css?v=3.11.1">
</head>
<body>
  <!-- شاشة الافتتاح: تظهر مرة في كل جلسة -->
  <style>
    #splash{position:fixed;inset:0;z-index:95;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#fff;text-align:center;font-family:Cairo,system-ui,sans-serif;
      background:radial-gradient(120% 80% at 50% 35%,#6a3aa0 0%,#3b1d63 45%,#1a0b2e 100%);transition:opacity .45s ease,visibility .45s}
    #splash.out{opacity:0;visibility:hidden}
    #splash .lg{width:118px;height:118px;border-radius:30px;box-shadow:0 18px 50px rgba(249,178,36,.25);animation:spPop .8s cubic-bezier(.2,1.4,.4,1) both}
    #splash .nm{font-size:27px;font-weight:800;letter-spacing:-.3px;margin-top:8px;animation:spUp .6s .25s both}
    #splash .sl{font-size:16px;font-weight:700;color:#fde08a;animation:spUp .6s .45s both}
    #splash .og{position:absolute;bottom:calc(28px + env(safe-area-inset-bottom));font-size:12.5px;color:#cbb8e6;animation:spUp .6s .6s both}
    #splash .bar{width:120px;height:4px;border-radius:9px;background:rgba(255,255,255,.12);overflow:hidden;margin-top:14px;animation:spUp .5s .6s both}
    #splash .bar i{display:block;height:100%;width:40%;border-radius:9px;background:linear-gradient(90deg,#f9b224,#fde08a);animation:spBar 1.1s ease-in-out infinite}
    @keyframes spPop{from{transform:scale(.6) rotate(-12deg);opacity:0}to{transform:none;opacity:1}}
    @keyframes spUp{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
    @keyframes spBar{0%{transform:translateX(160%)}100%{transform:translateX(-260%)}}
  </style>
  <div id="splash" aria-hidden="true">
    <svg class="lg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120"> <defs> <linearGradient id="spbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6a3aa0"/><stop offset="1" stop-color="#2e1650"/></linearGradient> <linearGradient id="spsun" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fde08a"/><stop offset="1" stop-color="#f9b224"/></linearGradient> </defs> <rect width="120" height="120" rx="28" fill="url(#spbg)"/> <g transform="translate(60 60)"> <g fill="#f9b224"> <rect x="-5" y="-47" width="10" height="11" rx="2"/><rect x="-5" y="-47" width="10" height="11" rx="2" transform="rotate(30)"/> <rect x="-5" y="-47" width="10" height="11" rx="2" transform="rotate(60)"/><rect x="-5" y="-47" width="10" height="11" rx="2" transform="rotate(90)"/> <rect x="-5" y="-47" width="10" height="11" rx="2" transform="rotate(120)"/><rect x="-5" y="-47" width="10" height="11" rx="2" transform="rotate(150)"/> <rect x="-5" y="-47" width="10" height="11" rx="2" transform="rotate(180)"/><rect x="-5" y="-47" width="10" height="11" rx="2" transform="rotate(210)"/> <rect x="-5" y="-47" width="10" height="11" rx="2" transform="rotate(240)"/><rect x="-5" y="-47" width="10" height="11" rx="2" transform="rotate(270)"/> <rect x="-5" y="-47" width="10" height="11" rx="2" transform="rotate(300)"/><rect x="-5" y="-47" width="10" height="11" rx="2" transform="rotate(330)"/> </g> <circle r="38" fill="#f9b224"/> <circle r="33" fill="#fff"/> <g stroke="#f9b224" stroke-width="3" stroke-linecap="round"> <path d="M0 -26v-4"/><path d="M-13 -22.5l-2 -3.5"/><path d="M13 -22.5l2 -3.5"/><path d="M-22.5 -13l-3.5 -2"/><path d="M22.5 -13l3.5 -2"/> </g> <circle cy="-6" r="12" fill="url(#spsun)"/> <path d="M0 2C-8 -3 -19 -4 -27 -1V21C-19 18 -8 19 0 24Z" fill="#552c83"/> <path d="M0 2C8 -3 19 -4 27 -1V21C19 18 8 19 0 24Z" fill="#7c4bb6"/> <path d="M-27 21C-19 18 -8 19 0 24C8 19 19 18 27 21" stroke="#f9b224" stroke-width="2.4" fill="none" stroke-linecap="round"/> <path d="M-20 6l13 2M-20 12l13 2M7 8l13 -2M7 14l13 -2" stroke="#fff" stroke-opacity=".55" stroke-width="1.8" stroke-linecap="round"/> </g> </svg>
    <div class="nm">حجز الكتب المخفضة</div>
    <div class="sl">علّم أكتر… وادفع أقل</div>
    <div class="bar"><i></i></div>
    <div class="og">النقابة العامة بالدقهلية</div>
  </div>
  <script>
    (function () {
      var sp = document.getElementById("splash"), seen = false;
      try { seen = sessionStorage.getItem("wb_splash"); sessionStorage.setItem("wb_splash", "1"); } catch (e) {}
      if (seen) { sp.remove(); return; }
      var t0 = Date.now(), done = function () { setTimeout(function () { sp.classList.add("out"); setTimeout(function () { sp.remove(); }, 500); }, Math.max(0, 1700 - (Date.now() - t0))); };
      if (document.readyState === "complete") done(); else window.addEventListener("load", done);
      setTimeout(done, 4000);
    })();
  </script>
  <div id="topProgress" class="hidden fixed top-0 inset-x-0 z-[70] h-[3px] overflow-hidden bg-brand-100"><div class="h-full w-1/2 bg-gradient-to-l from-gold-400 via-brand-500 to-brand-700 animate-progress"></div></div>
  <div id="blocker" class="hidden fixed inset-0 z-[65] bg-white/40 backdrop-blur-[1px] flex items-center justify-center">
    <div class="w-14 h-14 rounded-2xl bg-white shadow-lift flex items-center justify-center"><div class="w-7 h-7 rounded-full border-[3px] border-brand-200 border-t-brand-700 animate-spin"></div></div>
  </div>
  <div id="toasts" class="pointer-events-none fixed z-[80] inset-x-3 top-3 sm:top-auto sm:bottom-6 sm:left-6 sm:right-auto sm:w-[380px] flex flex-col gap-2" aria-live="polite"></div>
  <div id="app"></div>

  <script src="js/app.js?v=3.11.1"></script>
  <script src="js/art.js?v=3.11.1"></script>
  <script src="js/docs.js?v=3.11.1"></script>
  <script src="js/employee.js?v=3.11.1"></script>
  <script src="js/admin.js?v=3.11.1"></script>
  <script src="js/reports.js?v=3.11.1"></script>
</body>
</html>
