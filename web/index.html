<body>
  <!-- شاشة الافتتاح: مرة في كل جلسة حتى يضغط «يلا نبدأ»، وفيها عداد الحملة -->
  <style>
    #splash{position:fixed;inset:0;z-index:95;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:24px 18px calc(24px + env(safe-area-inset-bottom));color:#fff;text-align:center;font-family:Cairo,system-ui,sans-serif;overflow-y:auto;
      background:radial-gradient(120% 80% at 50% 30%,#6a3aa0 0%,#3b1d63 45%,#1a0b2e 100%);transition:opacity .35s ease,visibility .35s}
    #splash.out{opacity:0;visibility:hidden}
    #splash .lg{width:104px;height:104px;border-radius:26px;box-shadow:0 14px 40px rgba(249,178,36,.25)}
    #splash .nm{font-size:25px;font-weight:800;margin-top:6px}
    #splash .sl{font-size:16px;font-weight:700;color:#fde08a}
    #splash .cd{margin-top:14px;width:100%;max-width:340px;border-radius:20px;background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);padding:12px}
    #splash .cd .lb{font-size:13px;font-weight:700;color:#e9ddf8}
    #splash .cd .bx{display:flex;gap:8px;margin-top:8px}
    #splash .cd .bx div{flex:1;border-radius:14px;background:rgba(255,255,255,.1);padding:8px 0}
    #splash .cd b{display:block;font-size:24px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
    #splash .cd span{font-size:11px;color:#cbb8e6}
    #splash .go{margin-top:18px;border:0;cursor:pointer;font:800 17px Cairo,system-ui,sans-serif;color:#2e1650;padding:15px 30px;border-radius:999px;
      background:linear-gradient(135deg,#fde08a,#f9b224);box-shadow:0 10px 30px rgba(249,178,36,.4),inset 0 -3px 0 rgba(0,0,0,.12)}
    #splash .go:active{transform:scale(.97)}
    #splash .cr{margin-top:22px;font-size:12px;line-height:1.7;color:#cbb8e6}
    #splash .cr b{color:#fff;font-weight:700}
    #splash .og{margin-top:6px;font-size:13px;font-weight:700;color:#fde08a}
  </style>
  <div id="splash" aria-label="مرحباً">
    <svg class="lg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120"> <defs> <linearGradient id="spbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6a3aa0"/><stop offset="1" stop-color="#2e1650"/></linearGradient> <linearGradient id="spsun" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fde08a"/><stop offset="1" stop-color="#f9b224"/></linearGradient> </defs> <rect width="120" height="120" rx="28" fill="url(#spbg)"/> <g transform="translate(60 60)"> <g fill="#f9b224"> <rect x="-5" y="-47" width="10" height="11" rx="2"/><rect x="-5" y="-47" width="10" height="11" rx="2" transform="rotate(30)"/> <rect x="-5" y="-47" width="10" height="11" rx="2" transform="rotate(60)"/><rect x="-5" y="-47" width="10" height="11" rx="2" transform="rotate(90)"/> <rect x="-5" y="-47" width="10" height="11" rx="2" transform="rotate(120)"/><rect x="-5" y="-47" width="10" height="11" rx="2" transform="rotate(150)"/> <rect x="-5" y="-47" width="10" height="11" rx="2" transform="rotate(180)"/><rect x="-5" y="-47" width="10" height="11" rx="2" transform="rotate(210)"/> <rect x="-5" y="-47" width="10" height="11" rx="2" transform="rotate(240)"/><rect x="-5" y="-47" width="10" height="11" rx="2" transform="rotate(270)"/> <rect x="-5" y="-47" width="10" height="11" rx="2" transform="rotate(300)"/><rect x="-5" y="-47" width="10" height="11" rx="2" transform="rotate(330)"/> </g> <circle r="38" fill="#f9b224"/> <circle r="33" fill="#fff"/> <g stroke="#f9b224" stroke-width="3" stroke-linecap="round"> <path d="M0 -26v-4"/><path d="M-13 -22.5l-2 -3.5"/><path d="M13 -22.5l2 -3.5"/><path d="M-22.5 -13l-3.5 -2"/><path d="M22.5 -13l3.5 -2"/> </g> <circle cy="-6" r="12" fill="url(#spsun)"/> <path d="M0 2C-8 -3 -19 -4 -27 -1V21C-19 18 -8 19 0 24Z" fill="#552c83"/> <path d="M0 2C8 -3 19 -4 27 -1V21C19 18 8 19 0 24Z" fill="#7c4bb6"/> <path d="M-27 21C-19 18 -8 19 0 24C8 19 19 18 27 21" stroke="#f9b224" stroke-width="2.4" fill="none" stroke-linecap="round"/> <path d="M-20 6l13 2M     <div class="nm">حجز الكتب المخفضة</div>
    <div class="sl">نقابتك معاك… من أول كتاب</div>
    <div class="cd" id="spCd" hidden><div class="lb" id="spCdL"></div><div class="bx" dir="ltr"><div><b data-k="d">--</b><span>يوم</span></div><div><b data-k="h">--</b><span>ساعة</span></div><div><b data-k="m">--</b><span>دقيقة</span></div><div><b data-k="s">--</b><span>ثانية</span></div></div></div>
    <button class="go" id="spGo" type="button">يلا نبدأ نسجّل ونحجز</button>
    <div class="cr">التنفيذ والتصميم وجميع الحقوق محفوظة<br>للأستاذ <b>محمود العراقي</b> — أمين صندوق النقابة العامة بالدقهلية</div>
    <div class="og">النقابة العامة بالدقهلية</div>
  </div>
  <script>
    (function () {
      var sp = document.getElementById("splash"), seen = false;
      try { seen = sessionStorage.getItem("wb_splash"); } catch (e) {}
      if (seen) { sp.remove(); return; }
      document.getElementById("spGo").addEventListener("click", function () {
        try { sessionStorage.setItem("wb_splash", "1"); } catch (e) {}
        sp.classList.add("out"); setTimeout(function () { sp.remove(); }, 400);
      });
      /** عداد الحملة: يُستدعى من app.js بعد قراءة مواعيد المرحلة العامة */
      window.splashCountdown = function (ph) {
        var box = document.getElementById("spCd"); if (!box || !ph) return;
        var d = function (v) { if (!v) return null; var x = new Date(String(v).replace(" ", "T")); return isNaN(x) ? null : x; };
        var now = new Date(), st = d(ph.start), en = d(ph.end), dl = d(ph.delivery), at = null, lb = "";
        if (st && st > now) { at = st; lb = "🗓️ يبدأ الحجز بعد"; } else if (ph.open && en && en > now) { at = en; lb = "⏳ يقفل الحجز بعد"; } else if (dl && dl > now) { at = dl; lb = "📦 يبدأ التسليم بعد"; }
        if (!at) return;
        document.getElementById("spCdL").textContent = lb + (ph.name ? " — " + ph.name : ""); box.hidden = false;
        var tick = function () { if (!document.getElementById("spCd")) return clearInterval(t); var ms = Math.max(0, at - Date.now()), v = { d: Math.floor(ms / 864e5), h: Math.floor(ms / 36e5) % 24, m: Math.floor(ms / 6e4) % 60, s: Math.floor(ms / 1e3) % 60 };
          Object.keys(v).forEach(function (k) { var e = box.querySelector('[data-k="' + k + '"]'); if (e) e.textContent = String(v[k]).padStart(2, "0"); }); };
        tick(); var t = setInterval(tick, 1000);
      };
    })();
  </script>
  <div id="topProgress" class="hidden fixed top-0 inset-x-0 z-[70] h-[3px] overflow-hidden bg-brand-100"><div class="h-full w-1/2 bg-gradient-to-l from-gold-400 via-brand-500 to-brand-700 animate-progress"></div></div>
