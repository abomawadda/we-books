name: CI Tests & Auto-Sync logic_commit

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verify:
    name: Syntax Check & Test Suites (394+ checks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JS Syntax Check (All Frontend & Backend Modules)
        run: |
          for f in web/js/*.js web/sw.js supabase/functions/books-api/logic.js; do
            node --check "$f"
          done
      - name: Run Full Scenario Tests
        run: node test/scenarios.test.js | tail -n 10
      - name: Run Books-Pro & Enterprise Tests
        run: node test/books-pro.test.js

  sync-logic-commit:
    name: Auto-Update Supabase logic_commit
    needs: verify
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Update books.config.logic_commit in Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "Skipping auto-sync: SUPABASE_URL or SUPABASE_SERVICE_ROLE_KEY secret not set."
            exit 0
          fi
          URL="${SUPABASE_URL%/}"
          if [[ "$SUPABASE_SERVICE_ROLE_KEY" == sb_secret_* ]]; then
            curl -fsS -X POST "${URL}/rest/v1/rpc/sync_books_logic_commit" \
              -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
              -H "Content-Type: application/json" \
              -d "{\"new_commit\":\"${COMMIT_SHA}\"}"
          else
            curl -fsS -X POST "${URL}/rest/v1/rpc/sync_books_logic_commit" \
              -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
              -H "Content-Type: application/json" \
              -d "{\"new_commit\":\"${COMMIT_SHA}\"}"
          fi
          echo "Successfully synced logic_commit to ${COMMIT_SHA}"


